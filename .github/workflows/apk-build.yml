name: Build Android APK (TWA)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Build web app for production
      run: npm run build

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Generate Keystore
      run: |
        keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android

    - name: Create TWA Manifest
      run: |
        cat << 'EOF' > twa-manifest.json
        {
          "packageId": "com.remoplayer.app",
          "host": "ma4alhzmi1-ai-pro.github.io",
          "name": "REMO PLAYER",
          "shortName": "REMO",
          "startUrl": "/",
          "display": "standalone",
          "themeColor": "#0f172a",
          "backgroundColor": "#0f172a",
          "iconUrl": "https://raw.githubusercontent.com/ma4alhzmi1-ai-pro/remo-player-1-0-23/main/public/icon.png",
          "maskableIconUrl": "",
          "splashScreenFadeOutDuration": 300,
          "signingKey": {
            "path": "android.keystore",
            "alias": "android"
          },
          "generatorApp": "bubblewrap-cli",
          "appVersionName": "1.0.0",
          "appVersionCode": 1,
          "shortcuts": [],
          "webManifestUrl": "",
          "features": {},
          "alphaWarnings": false
        }
        EOF

    - name: Build APK with Bubblewrap
      run: |
        bubblewrap build --manifest=twa-manifest.json || true
        find . -name "*.apk"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-signed
        path: |
          *.apk
          app-release-signed.apk
          app/build/outputs/apk/**/*.apk
          **/*.apk
