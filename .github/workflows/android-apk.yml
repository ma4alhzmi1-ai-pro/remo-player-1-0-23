name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify application source
        run: |
          pnpm check
          pnpm test

      - name: Generate Android project
        env:
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew app:assembleRelease --no-daemon --stacktrace

      - name: Verify music service and absence of video background service
        working-directory: android
        run: |
          manifest=$(find app/build/intermediates -path '*release*' -name AndroidManifest.xml | head -n 1)
          test -n "$manifest"
          if ! grep -Eq 'expo\.modules\.audio\.service\.AudioControlsService' "$manifest"; then
            echo "Music background service is missing from final manifest"
            exit 1
          fi
          if ! grep -Eq 'android\.permission\.FOREGROUND_SERVICE_MEDIA_PLAYBACK' "$manifest"; then
            echo "Music background permission is missing from final manifest"
            exit 1
          fi
          if grep -Eq 'expo\.modules\.video\.playbackService\.ExpoVideoPlaybackService' "$manifest"; then
            echo "Video background service must not be present in final manifest"
            exit 1
          fi

      - name: Verify embedded JavaScript bundle
        run: |
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -E 'assets/index\.android\.(bundle|hbc)'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: REMO-PLAYER-Android-Standalone-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
