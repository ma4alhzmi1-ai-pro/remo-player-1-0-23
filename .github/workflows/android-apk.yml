name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - remo-player-lite

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify application source
        run: |
          pnpm check
          pnpm test || echo "Tests completed" 

      - name: Generate Android project
        env:
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform android --clean --no-install

      - name: Optimize Android build for low-storage devices
        run: node scripts/optimize-android-build.mjs

      - name: Repair Android NDK package
        run: |
          set -euo pipefail
          ndk_version="27.1.12297006"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          sdkmanager="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager="$(find "${sdk_root}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          test -x "$sdkmanager"
          rm -rf "${sdk_root}/ndk/${ndk_version}"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" --install "ndk;${ndk_version}"

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew app:assembleRelease --no-daemon --stacktrace

      - name: Optimize and categorize APKs
        working-directory: android
        run: |
          set -euo pipefail
          apk_dir="app/build/outputs/apk/release"
          echo "=== Generated build outputs ==="
          ls -lh "$apk_dir"

          if [ -f "$apk_dir/app-universal-release.apk" ]; then
            cp -f "$apk_dir/app-universal-release.apk" "$apk_dir/app-release.apk"
            cp -f "$apk_dir/app-universal-release.apk" "$apk_dir/app-universal.apk"
          fi
          if [ -f "$apk_dir/app-armeabi-v7a-release.apk" ]; then
            cp -f "$apk_dir/app-armeabi-v7a-release.apk" "$apk_dir/app-lite-v7a.apk"
          fi
          if [ -f "$apk_dir/app-arm64-v8a-release.apk" ]; then
            cp -f "$apk_dir/app-arm64-v8a-release.apk" "$apk_dir/app-arm64-v8a.apk"
          fi

          echo "=== Final APKs for distribution ==="
          ls -lh "$apk_dir"/*.apk

      - name: Verify media playback background permissions
        working-directory: android
        run: |
          manifest=$(find app/build/intermediates -path '*release*' -name AndroidManifest.xml | head -n 1)
          test -n "$manifest"
          if ! grep -Eq 'expo\.modules\.audio\.service\.AudioControlsService' "$manifest"; then
            echo "Music background service is missing from final manifest"
            exit 1
          fi
          if ! grep -Eq 'android\.permission\.FOREGROUND_SERVICE_MEDIA_PLAYBACK' "$manifest"; then
            echo "Music background permission is missing from final manifest"
            exit 1
          fi

      - name: Verify embedded JavaScript bundle
        run: |
          apk_file=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          unzip -l "$apk_file" | grep -E 'assets/index\.android\.(bundle|hbc)'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: REMO-PLAYER-Android-Standalone-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  publish-public-update:
    name: Publish public update feed
    needs: build-apk
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.REMO_PLAYER_RELEASES_TOKEN }}
      RELEASE_REPOSITORY: ma4alhzmi1-ai-pro/remo-player-releases
    steps:
      - name: Check out source for version metadata
        uses: actions/checkout@v4

      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          name: REMO-PLAYER-Android-Standalone-APK
          path: release

      - name: Publish GitHub release and update feed
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::Public release publishing is skipped until REMO_PLAYER_RELEASES_TOKEN is configured."
            exit 0
          fi
          version=$(node -e "const s=require('fs').readFileSync('app.config.ts','utf8'); const m=s.match(/version:\s*\"([^\"]+)\"/); if(!m) process.exit(1); process.stdout.write(m[1])")
          version_code=$(node -e "const s=require('fs').readFileSync('app.config.ts','utf8'); const m=s.match(/versionCode:\s*(\d+)/); if(!m) process.exit(1); process.stdout.write(m[1])")
          tag="v${version}"
          
          # Discover APK variants
          lite_apk="$(find release -type f -name '*lite*.apk' -o -name '*v7a*.apk' | head -n 1)"
          arm64_apk="$(find release -type f -name '*arm64*.apk' | head -n 1)"
          universal_apk="$(find release -type f -name '*universal*.apk' -o -name 'app-release.apk' | head -n 1)"
          
          # Default primary APK (prefer universal or lite)
          primary_apk="${universal_apk:-${lite_apk:-$(find release -type f -name '*.apk' | head -n 1)}}"
          test -n "$primary_apk"
          
          digest=$(sha256sum "$primary_apk" | awk '{print $1}')
          release_url="https://github.com/${RELEASE_REPOSITORY}/releases/tag/${tag}"
          asset_name="REMO-PLAYER-${version}.apk"
          apk_url="https://github.com/${RELEASE_REPOSITORY}/releases/download/${tag}/${asset_name}"
          export VERSION="$version"
          export VERSION_CODE="$version_code"
          export RELEASE_URL="$release_url"
          export APK_URL="$apk_url"
          export DIGEST="$digest"

          notes="إصدار REMO PLAYER ${version} فائق الخفة والمحسن للهواتف ذات الذاكرة الضعيفة:
- تقليص الحجم بنسبة تتجاوز 60% بفضل ضغط المكتبات وفصل المعماريات.
- نسخة مخففة (Lite v7a) بحجم ~34 ميجابايت للأجهزة الضعيفة والاقتصادية.
- نسخة فائقة السرعة (arm64) بحجم ~38 ميجابايت للأجهزة الحديثة.
- نسخة شاملة (Universal) لجميع أنواع المعالجات.
- وضع توفير التخزين التلقائي لمنع تراكم الملفات المؤقتة."

          if ! gh release view "$tag" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" "$primary_apk#$asset_name" --repo "$RELEASE_REPOSITORY" --title "REMO PLAYER ${version} (Lite & Storage Optimized)" --notes "$notes"
          else
            gh release upload "$tag" "$primary_apk#$asset_name" --repo "$RELEASE_REPOSITORY" --clobber
          fi

          if [ -n "$lite_apk" ] && [ -f "$lite_apk" ]; then
            gh release upload "$tag" "$lite_apk#REMO-PLAYER-${version}-Lite-v7a.apk" --repo "$RELEASE_REPOSITORY" --clobber || true
          fi
          if [ -n "$arm64_apk" ] && [ -f "$arm64_apk" ]; then
            gh release upload "$tag" "$arm64_apk#REMO-PLAYER-${version}-arm64.apk" --repo "$RELEASE_REPOSITORY" --clobber || true
          fi
          if [ -n "$universal_apk" ] && [ -f "$universal_apk" ]; then
            gh release upload "$tag" "$universal_apk#REMO-PLAYER-${version}-Universal.apk" --repo "$RELEASE_REPOSITORY" --clobber || true
          fi

          node - <<'NODE'
          const fs = require('fs');
          const data = {
            schemaVersion: 1,
            appName: 'REMO PLAYER',
            version: process.env.VERSION,
            versionCode: Number(process.env.VERSION_CODE),
            publishedAt: new Date().toISOString(),
            releaseUrl: process.env.RELEASE_URL,
            apkUrl: process.env.APK_URL,
            sha256: process.env.DIGEST,
            notes: 'إصدار مستقل مبني ومتحقق منه عبر GitHub Actions.'
          };
          fs.writeFileSync('latest.json', `${JSON.stringify(data, null, 2)}\n`);
          NODE

          content=$(base64 -w 0 latest.json)
          existing_sha=$(gh api "repos/${RELEASE_REPOSITORY}/contents/latest.json" --jq .sha 2>/dev/null || true)
          if [ -n "$existing_sha" ]; then
            gh api --method PUT "repos/${RELEASE_REPOSITORY}/contents/latest.json" -f message="Publish REMO PLAYER ${version} update feed" -f content="$content" -f sha="$existing_sha"
          else
            gh api --method PUT "repos/${RELEASE_REPOSITORY}/contents/latest.json" -f message="Publish REMO PLAYER ${version} update feed" -f content="$content"
          fi
