name: Build RemoKeyboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - "remo-keyboard-v*"
    paths:
      - "android-ime/**"
      - "scripts/check-native-ime.mjs"
      - ".github/workflows/build-remo-keyboard-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android 5+ installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify native keyboard source
        run: node scripts/check-native-ime.mjs

      - name: Configure Android SDK location
        working-directory: android-ime
        run: printf "sdk.dir=%s\n" "$ANDROID_HOME" > local.properties

      - name: Build debug APK
        working-directory: android-ime
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Create compressed APK package
        working-directory: android-ime/app/build/outputs/apk/debug
        run: zip -9 "RemoKeyboard-1.0.1-Android-APK.zip" app-debug.apk

      - name: Upload compressed APK
        uses: actions/upload-artifact@v4
        with:
          name: RemoKeyboard-1.0.1-Android-APK
          path: android-ime/app/build/outputs/apk/debug/RemoKeyboard-1.0.1-Android-APK.zip
          if-no-files-found: error
          retention-days: 90
