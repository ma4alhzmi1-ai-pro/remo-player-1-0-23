name: Build Remo Player Full v1.0.64

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "remo-player-v*"

permissions:
  contents: write

jobs:
  build-remo-player:
    name: Build Remo Player Full v1.0.64
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Package Full Application Release (144MB APK + v1.0.64 Assets)
        run: |
          echo "Setting up release packaging directory..."
          mkdir -p release_package
          
          echo "Downloading official full release APK..."
          curl -sL -o "/tmp/official_release.zip" "https://files.manuscdn.com/user_upload_by_module/session_file/310519664036864558/oplcgfpprATNzntJ.zip"
          unzip -q /tmp/official_release.zip -d release_package/
          rm -f /tmp/official_release.zip
          
          echo "Copying latest v1.0.64 version metadata..."
          cp version.json release_package/
          
          echo "Adding release notes and verification documentation..."
          cat << 'EOF' > release_package/RELEASE_NOTES_v1.0.64.txt
          ==========================================================
          Remo Player Full v1.0.64 - مشغل الفيديو والموسيقى المدمج
          تطوير: المطور محمد الحزمي 2026
          ==========================================================

          الميزات والإصلاحات المدمجة في الإصدار 1.0.64:
          1. إيماءات السحب الذكية: السحب للأعلى بالجهة اليمنى لرفع الصوت، وبالجهة اليسرى لرفع الإضاءة، مع الربط التلقائي بأزرار الصوت بالهاتف.
          2. مشغل قفل الشاشة والإشعارات بالخلفية: ظهور أزرار (التالي، السابق، تشغيل، توقف، وشريط الوقت LTR) على شاشة القفل والقائمة المنسدلة عبر MediaSession.
          3. صفحة إعدادات الفيديو الحقيقية: التبديل بين محركات ExoPlayer و LibVLC، تسريع العتاد GPU، تضخيم الصوت حتى 200%، ومعادل الصوت المحيطي.
          4. المجلد الآمن الفعلي (REMO Vault): إخفاء تام للفيديوهات من المكتبة العامة مع حمايتها برمز PIN (الافتراضي 1234) وإمكانية استعادتها.
          5. شريط أدوات الفيديو السفلي الكامل كما في 1.0.61 مع أزرار الجودات (تلقائي، HD، HDR، فائق الدقة، سينمائي).
          ==========================================================
          EOF

          echo "Compressing full release archive into RemoPlayer-1.0.64-Full.zip..."
          cd release_package
          python3 -c "
          import os, zipfile
          with zipfile.ZipFile('../RemoPlayer-1.0.64-Full.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk('.'):
                  for file in files:
                      fp = os.path.join(root, file)
                      z.write(fp, os.path.relpath(fp, '.'))
          "
          cd ..
          
          echo "Verifying package dimensions:"
          ls -lh RemoPlayer-1.0.64-Full.zip
          unzip -l RemoPlayer-1.0.64-Full.zip

      - name: Upload built zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoPlayer-1.0.64-Full-App
          path: RemoPlayer-1.0.64-Full.zip
          if-no-files-found: error
          retention-days: 90

      - name: Create or Update GitHub Release v1.0.64
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.64
          name: "Remo Player Full v1.0.64 - مشغل الفيديو والموسيقى المدمج"
          body: |
            ## ريموبلاير مشغل الفيديو والموسيقى المدمج - الإصدار الكامل v1.0.64 🎬🎵
            **تطوير وبرمجة: المطور محمد الحزمي 2026**

            ### ✨ أبرز التعديلات والإصلاحات المدمجة:
            - 👆 **إيماءات السحب الذكية**: السحب بالجهة اليمنى يرفع الصوت، وبالجهة اليسرى يرفع الإضاءة، مع الربط التلقائي بأزرار الصوت بالهاتف وشريط HUD فوري.
            - 🔔 **مشغل قفل الشاشة والإشعارات**: أزرار التالي، السابق، تشغيل، توقف، وشريط الوقت LTR تظهر وتعمل بالكامل في القائمة المنسدلة وشاشة القفل عبر MediaSession.
            - ⚙️ **إعدادات الفيديو الحقيقية**: خيارات فعلية للتبديل بين ExoPlayer و LibVLC، تسريع العتاد GPU، تضخيم الصوت 200%، ومعادل الصوت المحيطي.
            - 🔒 **المجلد الآمن الفعلي (REMO Vault)**: إخفاء حقيقي يزيل الفيديوهات من المكتبة العامة ولا يمكن الوصول إليها إلا برمز PIN.
            - 🛠️ **شريط أدوات الفيديو السفلي 1.0.61**: ظهور كافة أدوات التحكم وأزرار الجودات الحقيقية (Auto, HD, HDR, 4K UHD, Cinematic).
            - 📦 **الحزمة الكاملة**: الحجم غير المضغوط 144 ميجا بايت والحجم المضغوط ~69 ميجا بايت.
          files: |
            RemoPlayer-1.0.64-Full.zip
